defaults:
  - xqc_style
  - _self_

# Vision variant of xqc_style: adds camera observations (plain,
# non-pretrained, trainable ResNet18 - xqc/agents/common/vision.py, same
# encoder the actor side uses) alongside the low-dim state - vision trained
# from scratch on the critic itself, independent of any actor (see
# conversation history for the full design: joint gradient across critic+
# vision+obs_encoder, target_vision/target_obs_encoder Polyak-averaged same
# as target_critic).
#
# `dataset_path` is a top-level field (conf/critic_sarsa.yaml), not
# settable from here - still needs to be pointed at an image_v15.hdf5 (has
# both the low_dim keys and camera keys) on the command line, e.g.:
#   .venv/bin/python train_critic_sarsa.py critic=xqc_style_vision \
#       dataset_path=robomimic/datasets/square/ph/image_v15.hdf5
data:
  camera_keys: [agentview_image, robot0_eye_in_hand_image]
