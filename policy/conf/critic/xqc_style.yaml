defaults:
  - base_critic
  - _self_

# The UNMODIFIED production XQC critic (xqc/agents/critics/xqc_style/,
# xqc/networks/critic_net.py's VMapCritic) - every field below matches
# conf/agent/base_agent.yaml + conf/agent/xqc.yaml exactly (same
# CrossQ/BatchNorm/weight-norm/categorical-head recipe your supervisor's
# XQC experiments already use), just paired with the chunked-SARSA update
# instead of the full actor-critic loop - see xqc_style/critic.py's module
# docstring for the two things that actually differ.
name: xqc_style

hidden_dims_critic: [512, 512, 512, 512]
n_critics: 2
critic_loss: categorical
max_v: 5.0
min_v: -5.0
pre_activation_bn: true
use_layer_norm: false
use_batch_norm: true
skip_connections: false
use_weight_norm: true
