defaults:
  - base_agent
  - /actor@_here_: fm_state_abs # flow matching, state (no vision) + absolute actions (conf/actor/fm_state_abs.yaml)
  - _self_

# State-only variant of fm_vision_abs.yaml - see its own header comment:
# conditional flow matching (xqc/agents/actors/fm/flow_matching.py), BC
# pretraining only (online RL raises NotImplementedError on purpose - run
# with max_steps=0). No camera_keys/crop_shape here: fm_state_abs.yaml's
# camera_keys=[] already makes the env skip vision entirely and expose
# robot + both object (bottle/container) positions as plain state instead
# (see mip_state.yaml's own comment for the full mechanism).

# Behaviour-cloning pretraining of the actor only: no critic.
critic_name: null

# Robot-base-frame dataset written by policy/make_dataset.py (its layout/ group and
# env_scene.xml also define the evaluation env, see xqc/envs/pick_place.py).
offline_data_path: ${repo_root:}/videos/task/dataset_sim/policy/pick_place_bottle_base.hdf5
# null = every demo in the dataset (train_parallel_chunking.py counts them).
n_demos: null
