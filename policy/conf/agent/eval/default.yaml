# @package _global_
# Shared eval cadence/parallelism/video settings for every
# ChunkedPolicyLearner-based agent (xqc/agents/common/chunked_learner.py:
# DP, FM, MF, MIP, MIP-Flow, NF, BC). These are genuinely top-level cfg keys
# (train_parallel.py reads cfg.eval_interval, etc. directly, not
# cfg.agent.*), pulled in here via the @_global_ package override so that
# `agent=<name>` alone fully determines eval behavior, without depending on
# conf/config.yaml's own defaults (which remain the fallback for agents with
# no eval@_global_ override, e.g. xqc/xqcfd). Override any of these on the
# CLI as usual, or - for a genuine per-agent difference, not a leftover
# accidental one - override the specific field in that agent's own yaml on
# top of this include (see conf/agent/bc.yaml's own eval_episodes/
# eval_at_start overrides for the pattern).
#
# eval_episodes*num_seeds=50 matches the reference Diffusion Policy
# implementation's own n_test=50 exactly (diffusion_policy/config/task/
# square_lowdim.yaml's env_runner.n_test, the episode count behind its own
# checkpoint-selection test_mean_score metric) - num_seeds=10 (not fewer)
# keeps the same eval parallelism as before this fidelity pass, spreading
# the 50 episodes across 10 parallel replicas (5 sequential episodes each)
# rather than fewer, slower-to-eval replicas.
#
# eval_interval itself has no reference equivalent to match: the reference's
# own rollout_every=50 is in EPOCHS, not steps, and epochs-to-steps depends
# on batch_size, which genuinely differs between conf/agent/training/
# vision.yaml (64) and state.yaml (256) - there's no single step count that
# translates "every 50 epochs" correctly for both. eval_interval below is
# xqcfd's own tuned value, not reference-derived.
eval_interval: 10000
# Separate eval cadences for the offline and online phases (both default to
# eval_interval).
eval_interval_offline: ${eval_interval}
eval_interval_online: ${eval_interval}
eval_episodes: 5 # per-replica, not total - eval_env.num_tasks = num_seeds below (10), and xqc/envs/envs.py's evaluate() runs each replica independently until IT completes eval_episodes, so the actual episode count behind one eval point (averaged via np.mean() in log_metrics_to_wandb) is num_seeds*eval_episodes = 10*5 = 50 - see this file's own header comment. Was 10 (-> 100 total, 2x the reference) before that fidelity pass, and 50 (-> 500 total) before that, too slow - see git history/conversation.
eval_num_seeds: 10 # eval parallelism only: each extra seed evaluates a fully independent replica of the current policy, one OS process each (SubprocEnvPool, xqc/envs/subproc_worker.py). The training env keeps num_seeds (conf/config.yaml, 1): pretraining never steps it, and online RL needs num_seeds=1.
log_interval: 100 # how often (in steps) training-loss metrics get logged to wandb - separate from eval_interval, which gates the (expensive, rollout-based) eval/return/goal/video logging

# Whether to run an extra eval at step 1, before eval_interval's regular
# cadence kicks in - useful by default (catches a broken eval/logging
# pipeline immediately instead of after waiting eval_interval steps), but
# means a step-1 datapoint from the still-untrained/near-random policy shows
# up on eval curves. Set false to skip it.
eval_at_start: false
# Every eval runs twice when ema_rate < 1: EMA weights (eval/{phase}_ema/,
# eval/ema/; videos and "best" checkpoint) and live weights (eval/{phase}_live/,
# eval/live/) - train_parallel_chunking.py run_eval.
eval_video: true # record eval episodes (render_num_envs replicas, eval_video_episodes episodes each)
eval_video_local: true # save them as mp4 in <save_dir>/eval_videos/step_<N>/ (<hydra run dir>/... without save_dir; policy/train.py save_eval_videos)
eval_video_wandb: false # also upload them to wandb (storage-heavy)
eval_video_fps: 15 # the env control rate (15 Hz): real-time playback
eval_video_frameskip: 1
eval_video_num_envs: 1 # only render/log video from this many replicas (seed0, seed1, ...)
eval_video_episodes: 10 # episodes of footage captured per eval video - independent of eval_episodes, which sets how many episodes the reported mean return/goal/completion_speed are averaged over
eval_video_max_steps: 4000 # frame budget for eval_video_episodes worth of footage - raise if envs have long horizons and videos get cut off early

# Policy log-likelihood diagnostic (train_parallel_chunking.py, online phase
# only; MeanFlow and XQCFD actors only - a no-op for MIP/DP/FM/BC). 0 disables it.
loglik_interval: 1000
loglik_batch_size: 256
loglik_online_window: 10000
loglik_spread_samples: 8
loglik_jac_chunk: 16
