defaults:
  - base_agent
  - /actor@_here_: fm_vision_abs # flow matching, vision + absolute actions (conf/actor/fm_vision_abs.yaml)
  - _self_

# Conditional flow matching (xqc/agents/actors/fm/flow_matching.py): the same
# ChiUNet as Diffusion Policy, but actions are generated by integrating a learned
# velocity field with num_steps Euler steps (conf/actor/fm.yaml: 10).
# Same data, observations and actions as dp_vision_abs.yaml / bc_vision_abs.yaml.

# Behaviour-cloning pretraining of the actor only: no critic.
critic_name: null

# Robot-base-frame dataset written by policy/make_dataset.py (its layout/ group and
# env_scene.xml also define the evaluation env, see xqc/envs/pick_place.py).
offline_data_path: ${repo_root:}/videos/task/dataset_sim/policy/pick_place_bottle_base.hdf5
# null = every demo in the dataset (policy/train.py counts them).
n_demos: null

# One camera (see dp_vision_abs.yaml).
camera_keys: [agentview_image]
# The demos' images are 128 x 128; the random crop keeps ~90 % of the image.
crop_shape: [116, 116]
