defaults:
  - base_agent
  - /actor@_here_: dp_vision_abs # Diffusion Policy, vision + absolute actions (conf/actor/dp_vision_abs.yaml)
  - _self_

# Behaviour-cloning pretraining of the actor only: no critic.
critic_name: null

# Robot-base-frame dataset written by policy/make_dataset.py (its layout/ group and
# env_scene.xml also define the evaluation env, see xqc/envs/pick_place.py).
offline_data_path: ${repo_root:}/videos/task/dataset_sim/policy/pick_place_bottle_base.hdf5
# null = every demo in the dataset (policy/train.py counts them).
n_demos: null

# One camera: with an observation history of To frames, every camera multiplies
# the image work by To.
camera_keys: [agentview_image]
# The demos' images are 128 x 128 (sim/rollout_physics.py --image-size); the
# random crop keeps the same ~90 % of the image as the reference's 76 of 84.
crop_shape: [116, 116]
