defaults:
  - _self_
  - agent: fm_vision_abs        # base policy architecture (FM + vision + absolute actions)
  - env: PickPlaceBottle        # registered via conf/register_envs.py

# Path to a pre-trained base policy checkpoint directory (orbax format,
# written by train.py's own save_dir / step_<N> or "best" sub-folder).
base_checkpoint: ${repo_root:}/checkpoints/FM/2026-10-06_20-32-14/best

seed: 0
num_seeds: 1           # online RL training; ring buffer has no multi-seed support
eval_num_seeds: 10     # parallel eval replicas — matches train.py's 10×5=50 total episodes
eval_episodes: 5       # episodes per replica; total = eval_num_seeds * eval_episodes = 50
eval_at_start: false   # skip step-0 eval: concurrent EGL init across 10 workers crashes on cold start

# max_offline_demos:    # uncomment + set to an int to limit demo loading

# ---- Phase 1: buffer warmup -----------------------------------------------
total_steps: 300_000
learning_starts: 5000      # env steps with random noise; no gradient updates

# ---- Phase 2: critic warmup -----------------------------------------------
# Pure gradient steps on the filled buffers before the actor trains.
# Set to 0 to skip.
critic_warmup_steps: 10000

# ---- Phase 3: main RL loop ------------------------------------------------
# 4 critic updates : 1 actor update (matches residual_td3 reference)
updates_per_step: 4
actor_updates_per_step: 1   # actor fires every (updates_per_step // actor_updates_per_step) critic iters
n_step: 3                   # n-step TD return (reference default)

batch_size: 256
online_buffer_size: 300_000
offline_fraction: 0.5       # fraction of each batch drawn from the offline buffer

discount: 0.99
log_interval: 100

# ---- Debug -------------------------------------------------------------------
# Set to true to zero the residual delta and skip actor updates.
# The combined action collapses to the base policy alone, so success rate
# should match BC pre-training performance.  Useful to sanity-check the
# pipeline before residual RL training.
debug_freeze_residual: false
eval_interval: 999_999_999   # effectively disabled; use train/success_rate_last50

# ---- Checkpoint ----------------------------------------------------------
save_dir: ${repo_root:}/checkpoints/residual_FM/${now:%Y-%m-%d_%H-%M-%S}
save_interval: 10_000   # overwrite latest/ every N steps

# ---- Critic (VMapCritic, C51 categorical) --------------------------------
critic:
  hidden_dims: [256, 256, 256]
  n_bins: 51
  # Sparse reward: bottle touches box for ~9 steps at episode end (reward=1.0).
  # Max discounted return = sum_{k=0}^{8} 0.99^k ≈ 8.6  →  use [0, 10].
  min_v: 0.0
  max_v: 10.0
  n_critics: 2              # min-pair ensemble (RED-Q style)
  pre_activation_bn: true
  use_batch_norm: true
  use_weight_norm: true
  lr: 1.0e-4
  tau: 0.005                # Polyak target update coefficient

# ---- Residual actor (ResidualMLP) ----------------------------------------
residual:
  hidden_dims: [256, 256]
  action_scale: 0.1         # constrains |residual| per dim; also used as ActionScaler margin
  lr: 1.0e-6                # deliberately low: residual must not drift far from base policy
  l2_reg_weight: 1.0e-3     # L2 penalty on raw delta to keep residuals small

  # Exploration noise during Phase 1 (buffer warmup): uniform in
  # [-warmup_noise_scale, +warmup_noise_scale], matching reference's
  # random_action_noise_scale=0.2
  warmup_noise_scale: 0.2

  # Gaussian noise added to actor output during Phase 3 (main loop).
  # linear(stddev_max → stddev_min) over stddev_steps env steps.
  # Set stddev_max == stddev_min for a flat schedule (reference default: 0.05).
  stddev_max: 0.1
  stddev_min: 0.01
  stddev_steps: 200_000

# ---- W&B -----------------------------------------------------------------
wandb:
  project_name: humanoid_challenge_online
  entity:                   # unset = default account entity
  mode: online

# ---- Hydra job settings --------------------------------------------------
hydra:
  job:
    env_set:
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      MUJOCO_GL: "egl"
      MUJOCO_EGL_DEVICE_ID: "${egl_device_id:}"
      MKL_SERVICE_FORCE_INTEL: "0"
      WANDB_DIR: "/tmp"
