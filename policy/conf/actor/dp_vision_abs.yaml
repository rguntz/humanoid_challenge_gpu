defaults:
  - dp_vision
  - _self_

# Absolute-action variant of dp_vision.yaml - same relationship
# conf/agent/dp_state_abs.yaml has to conf/agent/dp_state.yaml (see its own
# comments for the full abs_action mechanism: rotation_6d conversion at
# dataset-load time, sample_actions's own rotation_6d -> axis-angle
# conversion back, and xqc/envs/robomimic.py's controller reconfiguration -
# all shared, agent-agnostic code, unchanged here).
#
# image_abs.hdf5 was generated from image_v15.hdf5 via
# scripts/convert_dataset_to_abs_action.py (only `actions` overwritten, obs/
# images left byte-identical) - verified faithful: max eef pos error 0.00090
# / rot error 0.00338, matching the delta-action baseline's own 0.00090 /
# 0.00337 almost exactly (see
# robomimic/datasets/square/ph/image_abs_conversion_eval/error_stats.pkl).
name: DP

abs_action: true
