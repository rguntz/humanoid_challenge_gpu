defaults:
  - chunking@_here_: chunking # choices: single, chunking (conf/agent/chunking/)
  - obs@_here_: vision # choices: state, vision (conf/agent/obs/)
  - training@_here_: vision # choices: state, vision (conf/agent/training/) - shared training/architecture config, matches conf/agent/dp.yaml
  - base_actor@_here_ # shared actor-architecture defaults (conf/actor/base_actor.yaml)
  - _self_

# Plain MLP behavior-cloning baseline (BCLearner, xqc/agents/bc/): direct
# MSE regression from observation to action (chunk), sharing the exact same
# data pipeline as DP/FM/MF/MIP/MIP-Flow (xqc/agents/common/chunked_learner.py's
# ChunkedPolicyLearner: dataset, obs_encoder, vision, normalization) but none
# of their modeling machinery (no ChiUNet, no noise/time conditioning, no
# iterative sampling). Meant as a debugging baseline: if this trains and
# produces sane actions but a flow agent doesn't, the problem is in the flow
# technique, not the pipeline. Only BC pretraining is implemented - online
# RL fine-tuning raises NotImplementedError on purpose. Run with
# max_steps=0 to stop right after pretraining instead of hitting that error.
#
# Nothing below is BC-specific except hidden_dims (xqc/agents/bc/mlp_policy.py)
# - everything else comes from conf/agent/training/vision.yaml, matching
# every other agent here, EXCEPT pre_training_steps: kept as BC's own
# (much smaller) value below, since BC's whole point is to be a *cheap,
# fast* pipeline sanity check, not a fully-trained baseline - that's a
# genuine BC-specific reason to diverge, not a leftover accidental one.
name: BC

# MLPPolicy architecture (xqc/agents/bc/mlp_policy.py). No emb_dim/model_dim/
# kernel_size/cond_predict_scale/dim_mult here - those come from
# conf/agent/training/vision.yaml but are unused by MLPPolicy (no ChiUNet;
# BC used to run its condition through its own StateMLPEncoder/
# VisionObsEncoder compression stage first, but now uses IdentityObsEncoder
# like every other agent sharing ChunkedPolicyLearner - see
# xqc/agents/common/obs_encoder.py's IdentityObsEncoder docstring).
hidden_dims: [256, 256]

# BC pretraining - see this file's own header comment for why this is the
# one deliberate override left. Revert to the shared 500_000-step budget:
# agent.pre_training_steps=500000.
pre_training_steps: 50000

# Eval overrides on top of conf/agent/eval/default.yaml - BC has no upstream
# reference in the Diffusion Policy repo to match episode counts against
# (it's an internal debugging baseline, not benchmarked against it), so
# eval_episodes stays at its own historical, much larger value (still
# num_seeds=10 parallel replicas, 100 episodes each = 1000 total, not the
# other agents' 50) rather than being pulled down to match. eval_at_start=
# false since BC trains fast enough that a step-1 near-random-policy eval
# point isn't worth the wait. Revert to the shared defaults: agent.eval_episodes=5
# agent.eval_at_start=true.
eval_episodes: 100
eval_at_start: false

# Sends this agent/task's runs to their own wandb project instead of
# cfg.wandb.project_name's shared default (see conf/agent/base_agent.yaml) -
# change this alongside conf/agent/training/vision.yaml's offline_data_path
# override (if any) when switching tasks.
wandb_project_name: robomimic_can
