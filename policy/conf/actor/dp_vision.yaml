defaults:
  - dp
  - _self_

# Vision variant of DP: adds camera observations (plain, non-pretrained,
# trainable ResNet18 - xqc/agents/common/vision.py, shared with MIP/NF/MF/FM/BC)
# alongside the low-dim state, exactly like conf/agent/mip_vision.yaml /
# nf_vision.yaml / mf_vision.yaml / fm_vision.yaml / bc_vision.yaml. DP's own
# conf/agent/dp.yaml already defaults obs@_here_/training@_here_ to vision -
# this file exists purely for naming symmetry with dp_state.yaml /
# dp_state_abs.yaml (agent=dp_vision is self-documenting the same way
# agent=dp_state is, even though agent=dp alone already behaves identically).
#
# Requires an image_v15.hdf5 dataset (has both the low_dim keys and camera
# keys - see scripts/download_robomimic_datasets.sh), and the env must be
# created with render=True / use_camera_obs=True for eval rollouts (i.e.
# eval_video=true) so ParallelEnv.get_images() has frames to fetch.
camera_keys: [agentview_image, robot0_eye_in_hand_image]
