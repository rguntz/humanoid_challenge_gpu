# @package _here_
defaults:
  - _self_

# State-specific overrides on top of base_actor.yaml (see its own header
# comment) - matches the reference Diffusion Policy implementation's own
# LOWDIM-task config (train_diffusion_unet_lowdim_workspace.yaml) exactly.
# Verified: obs_dim=23/action_dim=7 (robomimic square/ph, matching
# diffusion_policy/config/task/square_lowdim.yaml's own obs_dim/action_dim)
# and a direct params-count check against the reference's own
# ConditionalUnet1D(down_dims=[256,512,1024], diffusion_step_embed_dim=256)
# with this file's model_dim/emb_dim below gives an EXACT match: 65,878,279
# params both sides (xqcfd's ChiUNet also carries a small unused MIP-style
# auxiliary "scalar" head - 131,329 params - DP's own loss never reads it,
# excluded from that count).

# batch_size=256 (not vision.yaml's image-matching 64) matches the
# reference lowdim config's own default.
batch_size: 256

# model_dim=256/emb_dim=256 (not vision.yaml's image-tuned 512/128)
# reproduce the reference lowdim network's own down_dims=[256,512,1024]/
# diffusion_step_embed_dim=256 exactly.
model_dim: 256
emb_dim: 256

# ChunkedNormalizationStats' own observation normalizer scheme - see
# xqc/replay_buffer/chunked_qc_buffer.py's own _compute_stats_lowdim
# docstring for all three options. "global" (default, unchanged - explicit
# request, see conversation history) matches the reference Diffusion Policy
# implementation's own lowdim get_normalizer exactly - a single scalar scale
# (1/max|obs|) applied to every observation dimension uniformly. "per_dim_range"
# is a NOT-reference-matching alternative (per-dimension min-max to [-1,1],
# the same convention as the image task) - kept only as a debugging lever,
# do not use it as a real alternative to "global" outside a specific test.
# "identity" (explicit request - see conversation history): no observation
# normalization at all, matching xqc/agents/xqc/xqc_learner.py's own
# reference pipeline exactly (raw obs -> network directly) - used by
# conf/actor/xqcfd_state.yaml specifically, to remove this as a possible
# confound when comparing against that reference.
lowdim_normalizer: global
