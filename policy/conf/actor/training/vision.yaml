# @package _here_
defaults:
  - _self_

# Vision-specific overrides on top of base_actor.yaml (see its own
# header comment) - matches the reference Diffusion Policy implementation's
# own IMAGE-task config (train_diffusion_unet_hybrid_workspace.yaml)
# exactly: batch_size/model_dim/emb_dim are the only 3 fields that
# genuinely differ from the LOWDIM-task config (conf/actor/training/state.yaml).

# batch_size=64 matches the reference image-task config's own default.
batch_size: 64

# model_dim=512/emb_dim=128 match the reference's own down_dims=
# [512,1024,2048]/diffusion_step_embed_dim=128 (emb_dim does double duty
# here as both the diffusion/flow-timestep embedding width and the vision
# feature concat width).
model_dim: 512
emb_dim: 128

# Vision encoder + vision-only architecture constants (xqc/agents/common/
# vision.py) - genuinely vision-only (meaningless once camera_keys is
# empty), unlike base_actor.yaml's own eef_pos_dim/eef_quat_dim (used by
# both paths) - so state.yaml doesn't set any of these at all, relying on
# ChunkedPolicyLearner.__init__'s own matching Python defaults instead of
# duplicating them for no reason (see conversation history).
#
# vision_encoder=resnet (build_vision_encoder's choices: "resnet" ->
# PlainResNet18Encoder, random init, trained from scratch, matching the
# reference exactly; "vit" -> PretrainedViTEncoder, a pretrained checkpoint
# fine-tuned jointly - see the *_vit.yaml agent configs, e.g.
# conf/agent/fm_vit.yaml, which override this to "vit"). vision_norm_type=
# group (GroupNorm instead of BatchNorm) matches the reference, which
# explicitly swaps to GroupNorm because EMA-ing BatchNorm's running stats
# separately from its own affine params causes a train/eval mismatch.
# random_crop/crop_shape: random 76x76 crop at train time, fixed center
# crop at eval - a well-documented ingredient for robomimic image-BC
# success with only 200 demos.
vision_encoder: resnet
vision_norm_type: group
random_crop: true
crop_shape: [76, 76]

# vision_feature_dims[X] is the pooled-feature width for vision_encoder=X,
# needed before any image is actually encoded (to size
# raw_condition_dim/obs_offset/obs_scale) - "resnet"'s own value MUST equal
# spatial_softmax_feature_dim just below (the SpatialSoftmax feature width
# IS the resnet path's pooled output width) - keep them in sync if you ever
# change one. spatial_softmax_num_kp/spatial_softmax_feature_dim:
# robomimic's own SpatialSoftmax BC-RNN image defaults (num_kp=32, output
# projected through Linear(., 64) - see xqc/agents/common/vision.py's
# SpatialSoftmaxPool docstring). vit_image_size: google/vit-base-patch16-224's
# own required square input resolution (only meaningful when
# vision_encoder=vit - not tunable without a different checkpoint entirely).
# range_eps: diffusion_policy/common/normalize_util.py's
# get_range_normalizer_from_stat own range_eps, reproduced exactly by
# ChunkedOfflineImageDataset.compute_stats.
vision_feature_dims:
  resnet: 64
  vit: 768
spatial_softmax_num_kp: 32
spatial_softmax_feature_dim: 64
vit_image_size: 224
range_eps: 1e-7
