defaults:
  - chunking@_here_: chunking # choices: single, chunking (conf/agent/chunking/)
  - obs@_here_: vision # choices: state, vision (conf/agent/obs/)
  - training@_here_: vision # choices: state, vision (conf/agent/training/) - shared training/architecture config, matches conf/agent/dp.yaml
  - base_actor@_here_ # shared actor-architecture defaults (conf/actor/base_actor.yaml)
  - _self_

# Conditional flow-matching BC policy (FMLearner, xqc/agents/fm/): a
# multi-step (N-step Euler) generative denoising policy over chunked
# actions, trained via the standard conditional flow-matching identity
# (linear/rectified-flow interpolant). Only BC pretraining is implemented -
# online RL fine-tuning raises NotImplementedError on purpose. Run with
# max_steps=0 to stop right after pretraining instead of hitting that error.
#
# Nothing below is FM-specific except num_steps - everything else comes
# from conf/agent/training/vision.yaml, deliberately matching DP (FM's own
# original upstream reference, much-ado-about-noising, is not what this
# repo benchmarks against - see xqc/agents/fm/flow_matching.py's module
# docstring).
name: FM

# Flow matching (xqc/agents/fm/flow_matching.py). num_steps is only used at
# inference (forward-Euler steps integrating t=0 -> t=1); training always
# samples t ~ Uniform(0,1) directly. 10 is a speed/accuracy compromise -
# far more accurate than the reference's own (broken) num_steps=1 default,
# still cheap enough for real-time control.
num_steps: 10
