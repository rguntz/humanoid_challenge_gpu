# @package _here_
# Chunked actions: predict a To-step observation history -> Ta-step action
# chunk, execute execution_horizon steps of it before replanning.
To: 2
# Ta=16 (NOT this file's own To/execution_horizon - matches the reference's
# own horizon=16/n_action_steps=8 split exactly: Ta plays the reference's
# `horizon` role - the full diffused window, starting (To-1) steps before
# "now" - execution_horizon plays `n_action_steps`. sample_actions() slices
# the executed chunk out starting at index To-1, matching the reference's
# own predict_action `start = To - 1`. Ta must stay >= To-1+execution_horizon
# (enforced in ChunkedPolicyLearner.__init__). Moved here from
# conf/actor/base_actor.yaml, which used to set this AFTER this file was
# composed and so always won - see that file's own comment for the full
# story and why that broke conf/actor/chunking/single.yaml's own Ta=1.
Ta: 16
execution_horizon: 8
# dim_mult=[1,2,2] (ChiUNet backbone, xqc/agents/common/network.py) matches
# the reference's own down_dims 3-level structure on both the image and
# lowdim tasks - only model_dim/emb_dim (the actual channel widths) differ
# between them, set in conf/actor/training/{vision,state}.yaml. Moved here
# from conf/actor/base_actor.yaml for the same reason as Ta above (see its
# own comment) - this needs to change together with Ta/execution_horizon
# whenever the chunking regime changes, so it belongs in the SAME preset
# file, not a separately-composed one that happens to be overridden last.
dim_mult: [1, 2, 2]
# Ablation knob, default ON: masks out the actor's BC loss contribution
# from samples whose Ta-length window needed more near-episode-boundary
# padding than the reference Diffusion Policy's own SequenceSampler would
# have tolerated (see xqc/agents/common/loss_masking.py and ChunkedBatch's
# own in_reference_region docstring in xqc/replay_buffer/chunked_qc_buffer.py).
# Sampling coverage itself is unaffected either way - only the loss
# weighting changes. Set false to ablate (every sample weighted equally,
# including near-boundary padded ones).
mask_reference_region: true
