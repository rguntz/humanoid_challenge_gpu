# @package _here_
# Single-step actions: predict/execute one action at a time (no chunking).
# NOTE: NF (conf/agent/nf.yaml) asserts Ta >= 2 (RealNVP needs chunked
# actions, algorithmically - a coupling flow needs at least two timesteps to
# split into "transform this half, condition on that half") - selecting
# "single" for agent=nf still raises at construction time; dim_mult below
# does not fix this (it's not a shape bug for NF, see conversation history).
To: 1
Ta: 1
execution_horizon: 1

# dim_mult=[1] (single-resolution, NOT chunking.yaml's own [1, 2, 2]) -
# explicit request, see conversation history: with Ta=1, xqc/agents/common/
# network.py's ChiUNet.Downsample1d floors at
# length 1 (a stride-2 conv on a length-1 sequence can't shrink further,
# so it silently returns length 1 again) while Upsample1d has no such
# floor (always doubles) - once dim_mult has more than one level, this
# asymmetry makes the up-path's skip-connection concat hit a genuine
# sequence-length mismatch (traced by hand: crashes at the SECOND
# concatenate for dim_mult=[1,2,2]/Ta=1). dim_mult=[1] sidesteps this
# entirely rather than working around it: with only one resolution level,
# ChiUNet's own down/up loops never call Downsample1d/Upsample1d at all
# (network.py's own module docstring already documents this as "inherent
# to the architecture, not specific to this port") - it degenerates to a
# flat stack of length-invariant (kernel-5, SAME-padded) FiLM-conditioned
# residual blocks, which is the architecturally CORRECT thing for a
# single-timestep prediction anyway (there is no multi-resolution
# structure to exploit over one timestep). Harmless for actors with no
# dim_mult field at all (BC's MLPPolicy, XQCFD - both already absorb this
# key into their own **kwargs catch-all unused, matching how
# kernel_size/cond_predict_scale/n_groups already do for them today).
dim_mult: [1]
