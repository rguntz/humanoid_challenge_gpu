defaults:
  - dp_state
  - _self_

# Absolute-action variant of dp_state.yaml - same task/network/DDPM
# hyperparameters, only the action representation differs (10-dim
# [pos(3), rotation_6d(6), gripper(1)] instead of dp_state.yaml's 7-dim
# delta [pos(3), axis-angle rot(3), gripper(1)]) - matches the reference
# Diffusion Policy implementation's own square_lowdim_abs.yaml (same
# task/network/DDPM config as square_lowdim.yaml, only
# task.dataset.abs_action/task.env_runner.abs_action set to true).
#
# abs_action=true makes xqc/agents/common/dataset.py's
# ChunkedOfflineLowdimDataset convert each recorded action from
# [pos, axis-angle rot, gripper] to [pos, rotation_6d, gripper] once at
# load time (RotationTransformer's own forward, see
# xqc/agents/common/rotation_transformer.py), use the reference's own
# robomimic_abs_action_only_normalizer_from_stat-equivalent normalizer
# (per-dim range-to-[-1,1] on pos, identity on rotation_6d+gripper) instead
# of the identity-everywhere normalizer dp_state.yaml's delta actions use,
# and makes ChunkedPolicyLearner.sample_actions convert the network's own
# rotation_6d output back to axis-angle before returning an action to the
# env. xqc/envs/robomimic.py's make_robomimic_env is told (via
# train_parallel.py's own env construction, threaded through from
# agent.abs_action here) to reconfigure the controller into absolute-pose
# mode (input_type="absolute") to match - see that function's own
# abs_action handling for why this can't just be read from the dataset's
# own recorded env_args.
#
# Requires robomimic/datasets/square/ph/low_dim_abs.hdf5 to exist first -
# see scripts/convert_dataset_to_abs_action.py (README's own "Converting to
# absolute-action datasets" section has the exact command).
name: DP

abs_action: true
