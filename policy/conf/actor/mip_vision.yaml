  - mip
  - _self_

# Vision variant of MIP: adds camera observations (plain, non-pretrained,
# trainable ResNet18 - xqc/agents/mip/vision.py, matching MIP's own default
# get_resnet(weights=None)) alongside the low-dim state, following
# xqc/networks/mip/encoders.py's MultiImageObsEncoder structure (per-key rgb
# encoding -> shared backbone -> concatenated with low-dim features).
#
# Requires an image_v15.hdf5 dataset (has both the low_dim keys and camera
# keys - see scripts/download_robomimic_datasets.sh), and the env must be
# created with render=True / use_camera_obs=True for eval rollouts (i.e.
# eval_video=true) so ParallelEnv.get_images() has frames to fetch.
camera_keys: [agentview_image, robot0_eye_in_hand_image]
