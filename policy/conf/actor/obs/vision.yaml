# @package _here_
# Vision observations: adds camera keys, encoded by a plain, non-pretrained,
# trainable ResNet18 (xqc/agents/common/vision.py) alongside the low-dim
# state. Requires an image_v15.hdf5 dataset (see
# scripts/download_robomimic_datasets.sh), and the env must be created with
# render=True / use_camera_obs=True for eval rollouts (i.e. eval_video=true,
# the default) so ParallelEnv.get_images() has frames to fetch.
camera_keys: [agentview_image, robot0_eye_in_hand_image]
