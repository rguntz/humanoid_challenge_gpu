[project]
name = "humanoid-challenge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dill",
    "h5py>=3.16.0",
    "imageio-ffmpeg>=0.6.0",
    "mujoco>=3.14.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "reportlab>=5.0.1",
    "wilor-mini",
    # Policy training (policy/): the JAX stack pinned to the versions the xqc
    # code was developed and tested with.
    "jax[cuda12]==0.4.30",
    "flax==0.8.4",
    "optax==0.2.3",
    "orbax-checkpoint==0.6.4",
    "tensorflow-probability==0.24.0",
    "gymnasium>=1.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.16",
    "termcolor>=2.4",
    "tqdm>=4.66",
    # Residual RL (resfit/): the versions of ResFiT's own environment
    # (resfit/README.md): lerobot at the commit ResFiT was written against (its
    # pre-0.2 `lerobot.common.*` API), datasets 3.6 (that lerobot breaks with 4.x),
    # torchrl 0.9.2 and the torch release it is built for. The smolvla extra: SmolVLA
    # (resfit/lerobot/policies/smolvla/) needs transformers, accelerate and num2words.
    "lerobot[smolvla]",
    "datasets==3.6.0",
    "draccus==0.10.0",
    "diffusers==0.33.1",
    # torch 2.8.0/torchvision 0.23.0 on x86_64 (standard PyPI CUDA wheels); on aarch64
    # (Isambard) the only CUDA-enabled aarch64 torch wheel is 2.10.0+ (download.pytorch.org's
    # own index, see [tool.uv.index]/[tool.uv.sources] below) - plain PyPI only has a
    # CPU-only aarch64 wheel for torch. LOCAL-ONLY, see isambard_slurm_jobs.md.
    "torch==2.8.0; platform_machine == 'x86_64'",
    "torch==2.10.0; platform_machine == 'aarch64'",
    "torchvision==0.23.0; platform_machine == 'x86_64'",
    "torchvision==0.25.0; platform_machine == 'aarch64'",  # the version torch 2.10.0 requires
    "torchcodec==0.7.0; platform_machine == 'x86_64'",  # no aarch64 wheels; not needed by policy/ on Isambard
    "torchrl==0.9.2",
    "tensordict==0.9.1",
    "einops>=0.8",
    "safetensors>=0.4",
    "huggingface-hub>=0.27.1",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "psutil>=5.9",
    "matplotlib>=3.8",
]

[tool.uv]
# Only resolve for Linux x86_64 or aarch64 (GH200/Isambard): the CUDA builds of
# JAX and torch only exist for those. LOCAL-ONLY WIDENING (not pushed upstream):
# aarch64 added for Isambard; keep this uncommitted there, see isambard_slurm_jobs.md.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# lerobot pins gymnasium==0.29.1 (its own envs); ResFiT, and policy/, use gymnasium 1.x.
# wilor-mini caps torch<=2.5 because torch 2.6 made torch.load default to
# weights_only=True, which its checkpoints and ultralytics' YOLO loader do not
# support; hand_tracking/track_hands.py restores the old default instead.
override-dependencies = [
    "gymnasium>=1.0",
    "torch==2.8.0; platform_machine == 'x86_64'",
    "torch==2.10.0; platform_machine == 'aarch64'",
]
# lerobot (mid-2025) and datasets 3.6 predate these major releases, which break them
# (e.g. av 19 returns AVRational where lerobot expects a number).
# transformers: SmolVLA at that lerobot commit is written against the 4.52 API of its vision-
# language model (SmolVLM2); later releases changed it.
constraint-dependencies = ["av>=15.1,<16", "pandas<3", "pyarrow<21", "huggingface-hub<1.0", "transformers<4.53"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
# chumpy (pulled in by wilor-mini) imports pip in its setup.py. It is never imported
# at runtime (it breaks with numpy 2): hand_tracking/track_hands.py converts the MANO
# model to plain numpy instead.
chumpy = ["pip"]

[tool.uv.sources]
wilor-mini = { git = "https://github.com/warmshao/WiLoR-mini" }
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "69901b9b6a2300914ca3de0ea14b6fa6e0203bd4" }
# aarch64 only: plain PyPI's aarch64 torch/torchvision wheels are CPU-only; the
# CUDA (cu128) aarch64 builds live on PyTorch's own index instead. LOCAL-ONLY.
torch = [{ index = "pytorch-cu128", marker = "platform_machine == 'aarch64'" }]
torchvision = [{ index = "pytorch-cu128", marker = "platform_machine == 'aarch64'" }]
